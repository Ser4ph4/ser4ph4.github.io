<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AWS SES Simple Logo</title>
  <desc id="desc">Minimal AWS SES logo with an envelope icon and SES text.</desc>

  <rect width="512" height="512" rx="96" fill="#111827"/>

  <!-- Envelope mark -->
  <rect x="104" y="126" width="304" height="204" rx="28" fill="#FF9900"/>
  <path d="M124 150L256 254L388 150" stroke="#111827" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M124 306L218 230" stroke="#111827" stroke-width="22" stroke-linecap="round"/>
  <path d="M388 306L294 230" stroke="#111827" stroke-width="22" stroke-linecap="round"/>

  <!-- Small send accent -->
  <path d="M332 104L424 82L390 168L371 132L332 104Z" fill="#FFFFFF"/>
  <path d="M371 132L424 82" stroke="#111827" stroke-width="10" stroke-linecap="round"/>

  <!-- Text -->
  <text x="256" y="407" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="700" letter-spacing="8" fill="#FFFFFF">SES</text>
  <text x="256" y="446" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="4" fill="#FF9900">AWS EMAIL</text>
</svg>
